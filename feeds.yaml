# FR-101/FR-102: feed configuration. Each entry: name, url, packs, enabled
# (default true), weight (default 1.0), lang (default en).
#
# Packs:
#   ai-research  — labs, research orgs, technical blogs
#   ai-industry  — trade press, funding, product coverage
#   tech-policy  — regulation, legislation, litigation, government
#   general-tech — broad outlets covering the above with editorial weight
#
# Weight (FR-506 canonical title selection): primary sources / original
# reporting = 1.2-1.5. Aggregators / rewrite shops = 0.5-0.8.
#
# Status: batch 1 of N, proposed and not yet validated. Run
# `python tools/validate_feeds.py` and remove anything flagged DEAD before
# treating this file as trustworthy.

feeds:
  # --- Intentional canary — do not remove ---
  # Deliberately broken URL. Proves FR-104: after FAIL_STREAK_LIMIT
  # consecutive failures this MUST be flagged `degraded`, not crash the
  # pipeline. Required by week 1's done-criteria.
  - name: "Broken Feed Canary"
    url: "https://example.invalid/feed.xml"
    packs: ["general-tech"]

  # --- ai-research ---
  - name: "arXiv cs.AI"
    url: "http://export.arxiv.org/rss/cs.AI"
    packs: ["ai-research"]
    weight: 1.3

  - name: "arXiv cs.CL"
    url: "http://export.arxiv.org/rss/cs.CL"
    packs: ["ai-research"]
    weight: 1.3

  - name: "Google DeepMind Blog"
