    packs: ["ai-research"]
    weight: 1.4

  - name: "Google Research Blog"
    url: "https://blog.research.google/feeds/posts/default"
    packs: ["ai-research"]
    weight: 1.4

  - name: "Microsoft Research Blog"
    url: "https://www.microsoft.com/en-us/research/feed/"
    packs: ["ai-research"]
    weight: 1.4

  - name: "BAIR Berkeley Blog"
