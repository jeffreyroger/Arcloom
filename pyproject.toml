[project]
name = "arcloom"
version = "0.1.0"
description = "Arc Loom — a personal news storyline tracker"
requires-python = ">=3.11"
dependencies = [
  "httpx",
  "feedparser",
  "pyyaml",
  "python-dateutil",
  "sentence-transformers",
  "numpy",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
